<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attestto DAO - Admin Portal</title>
    <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/108633374?s=200&v=4">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #08070f; color: #f3f4f6; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-md w-full bg-[#130f21] border border-purple-500/30 p-8 rounded-3xl text-center space-y-6 shadow-2xl">
        <img src="https://avatars.githubusercontent.com/u/108633374?s=200&v=4" alt="Attestto Logo" class="w-16 h-16 mx-auto rounded-2xl border border-purple-500/40 shadow-lg">
        <div>
            <h1 class="font-display text-2xl font-bold text-white">Admin Management Portal</h1>
            <p class="text-xs text-gray-400 mt-1">Connect your authorized founder wallet to manage Attestto DAO.</p>
        </div>

        <button onclick="redirectToMainAdmin()" class="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-extrabold text-sm rounded-xl transition-all shadow-lg shadow-purple-500/20">
            Open Full Admin Console
        </button>

        <a href="/" class="block text-xs text-purple-400 hover:text-purple-300">← Back to Governance Main Page</a>
    </div>

    <script>
        function redirectToMainAdmin() {
            window.location.href = "/#admin";
        }
    </script>
</body>
</html>
